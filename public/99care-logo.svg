<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="520" height="160" fill="none">
  <defs>
    <!-- Brand Colors -->
    <!-- Teal: #0A9396, Red: #E63946 -->
    <style>
      .brand-teal { fill: #0A9396; }
      .brand-stroke-teal { stroke: #0A9396; }
      .brand-red { fill: #E63946; }
      .serif-text { font-family: 'Playfair Display', Georgia, 'Times New Roman', serif; }
      .script-text { font-family: 'Caveat', 'Dancing Script', 'Brush Script MT', cursive; }
    </style>
  </defs>

  <!-- Left Circular Swoosh & Connected 99 Mark -->
