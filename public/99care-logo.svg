<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 120" width="460" height="120" fill="none">
  <defs>
    <linearGradient id="primaryTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8" />
      <stop offset="100%" stop-color="#0D9CAA" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0D9CAA" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Modern Dual-9 Heart Emblem -->
  <g transform="translate(10, 10)" filter="url(#glow)">
    <!-- Base Glow Pill -->
    <rect x="0" y="0" width="100" height="100" rx="28" fill="url(#primaryTeal)" opacity="0.08"/>
    
    <!-- Outer Shield / Circle Container -->
    <rect x="2" y="2" width="96" height="96" rx="26" fill="white" stroke="url(#primaryTeal)" stroke-width="2.5"/>

    <!-- Integrated Dual-9 Heart Icon -->
    <!-- Left 9 -->
    <path d="M 38 32 C 28 32 24 40 24 48 C 24 58 32 64 42 64 C 48 64 52 61 54 57 L 54 74 C 54 78 50 82 44 82 C 40 82 36 80 34 77" 
          stroke="url(#primaryTeal)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="39" cy="48" r="7" fill="url(#primaryTeal)"/>

    <!-- Right 9 (Mirrored Heart Formation) -->
    <path d="M 62 32 C 72 32 76 40 76 48 C 76 58 68 64 58 64 C 52 64 48 61 46 57 L 46 74 C 46 78 50 82 56 82 C 60 82 64 80 66 77" 
          stroke="url(#emeraldGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="61" cy="48" r="7" fill="url(#emeraldGrad)"/>

    <!-- Medical Pulse Spark (Center Top) -->
    <path d="M 44 26 L 50 20 L 56 26" stroke="#00B4D8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Brand Typography -->
  <!-- 99 -->
  <text x="130" y="72" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="58" fill="#0F172A" letter-spacing="-1.5">
    99
  </text>

  <!-- CARE -->
  <text x="205" y="72" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="58" fill="#0D9CAA" letter-spacing="-0.5">
    CARE
  </text>

  <!-- Subtitle Tagline -->
  <text x="132" y="96" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#64748B" letter-spacing="3.5">
    HOME HEALTHCARE
  </text>
  
  <!-- Subtle Medical Cross Badge -->
  <g transform="translate(415, 34)">
    <circle cx="12" cy="12" r="12" fill="#10B981" opacity="0.15"/>
    <path d="M 12 7 V 17 M 7 12 H 17" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>