    <path d="M 75 14 C 40 14 16 38 16 75 C 16 112 42 136 78 136 C 105 136 128 120 136 94 C 131 106 114 125 80 125 C 48 125 28 104 28 75 C 28 44 50 25 80 25 C 96 25 110 32 120 42 C 108 24 92 14 75 14 Z" fill="#0A9396" />

    <!-- Outer Swoosh Arc 2 (Top Accent Crescent) -->
    <path d="M 60 22 C 85 10 115 14 132 30 C 114 20 88 18 60 22 Z" fill="#0A9396" opacity="0.95" />
    <path d="M 38 128 C 18 108 12 80 22 55 C 16 75 22 105 38 128 Z" fill="#0A9396" opacity="0.85" />

    <!-- Connected 99 Loop Emblem -->
    <!-- Left 9 -->
    <path d="M 64 52 C 54 52 46 60 46 70 C 46 80 54 88 64 88 C 74 88 82 80 82 70 C 82 60 74 52 64 52 Z M 64 62 C 68 62 72 65 72 70 C 72 75 68 78 64 78 C 60 78 56 75 56 70 C 56 65 60 62 64 62 Z" fill="#0A9396"/>
    <path d="M 80 72 C 80 88 74 100 66 108 C 62 112 56 114 52 114 C 48 114 46 110 48 106 C 52 102 60 96 68 86 Z" fill="#0A9396"/>

    <!-- Right 9 -->
    <path d="M 104 52 C 94 52 86 60 86 70 C 86 80 94 88 104 88 C 114 88 122 80 122 70 C 122 60 114 52 104 52 Z M 104 62 C 108 62 112 65 112 70 C 112 75 108 78 104 78 C 100 78 96 75 96 70 C 96 65 100 62 104 62 Z" fill="#0A9396"/>
    <path d="M 120 72 C 120 88 114 100 106 108 C 102 112 96 114 92 114 C 88 114 86 110 88 106 C 92 102 100 96 108 86 Z" fill="#0A9396"/>
  </g>

  <!-- Typography Right Side -->
  <!-- "Care" Serif Text -->
  <text x="168" y="96" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-weight="700" font-size="82" fill="#0A9396" letter-spacing="-1">
    Care
  </text>

  <!-- "Helping hands" Cursive Red Subtitle -->
  <text x="218" y="132" font-family="'Brush Script MT', 'Dancing Script', 'Caveat', cursive" font-weight="600" font-size="36" fill="#E63946" font-style="italic">
